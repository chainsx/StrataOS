# ESP-resident component activation policy.  This file is read before the
# root overlay is assembled, so changing it takes effect on the next boot.
# Keep system-core enabled; every enabled component must retain its declared
# dependencies.  Data-image capacity, backend and redundancy are configured
# in storage.conf through override.<component>.<volume>.* keys.
format=1
component.system-core.enabled=yes
component.kernel-modules.enabled=yes
component.network.enabled=yes
component.python.enabled=yes
component.openssh.enabled=yes
component.diagnostics.enabled=yes
component.docker.enabled=yes
component.graphics.enabled=yes
component.fonts-cjk.enabled=yes
component.firewall.enabled=yes
component.fail2ban.enabled=yes
