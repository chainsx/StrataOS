# StrataOS runtime storage policy. Component manifests declare data volumes;
# this file controls their placement and administrative protection policy.
format=2

# The default backend is the Linux data partition created from disk.conf.
backend.data.type=filesystem
backend.data.source=LABEL=STRATA_DATA
backend.data.filesystem=ext4
backend.data.path=/strataos

# Example backend on a second physical device:
# backend.secondary.type=filesystem
# backend.secondary.source=PARTUUID=00000000-0000-0000-0000-000000000000
# backend.secondary.filesystem=ext4
# backend.secondary.path=/strataos

components.backend=data
components.path=components
components.protection=sha256-slot

# Defaults are applied only when a component volume says `inherit`. They do
# not create a volume. A component is the authority for whether a volume
# exists, its identity, mount point, minimum size and migration epoch.
volume.default.backend=data
volume.default.mirror_backend=data
volume.default.redundancy=none
volume.default.integrity=crc32c
volume.default.preallocate=no
volume.default.growth=boot-only
volume.default.fsck=preen

# Component-specific administrative overrides use this form:
# override.docker.docker.redundancy=integrity-mirror
# override.docker.docker.mirror_backend=secondary
