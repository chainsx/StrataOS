# persistent: /var/log is stored in state.ext4
# volatile:   /var/log is tmpfs and only early boot summaries are retained
mode=persistent
early_boot_log=yes
kernel_log=yes
operation_log=yes
max_file_kib=2048
rotate_count=8
boot_log_count=16

# Optional BusyBox syslog remote endpoint, for example 192.0.2.10:514.
# Leave empty to disable remote forwarding.
remote=

