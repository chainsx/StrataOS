# StrataOS build-time disk layout. This file is parsed as data.
format=1
table=gpt
disk.guid=53545241-5441-4f53-8000-000000000001
sector_size=512
alignment_mib=4

# The image is sparse. Increase this value for larger prebuilt images; the
# final data partition consumes all space after the ESP.
image.size_mib=4672

partition.esp.number=1
partition.esp.guid=53545241-5441-4f53-8000-000000000002
partition.esp.type_guid=c12a7328-f81f-11d2-ba4b-00a0c93ec93b
partition.esp.size_mib=256
partition.esp.filesystem=fat32
partition.esp.label=STRATA_ESP
partition.esp.mount=/run/strata-esp

partition.data.number=2
partition.data.guid=53545241-5441-4f53-8000-000000000003
partition.data.type_guid=0fc63daf-8483-4772-8e79-3d69d8477de4
partition.data.size_mib=remaining
partition.data.min_size_mib=4096
partition.data.filesystem=ext4
partition.data.label=STRATA_DATA
partition.data.mount=/run/strata-data
partition.data.reserved_percent=1
partition.data.usage_type=largefile4
partition.data.auto_grow=yes
