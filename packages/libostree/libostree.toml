name = "libostree"
version = "2025.3"
kind = "target"
build_system = "autotools"
dependencies = ["glib", "libarchive", "curl", "openssl", "zlib", "xz", "zstd", "e2fsprogs", "gpgme"]
configure_args = [
    "--disable-static",
    "--enable-shared",
    "--disable-installed-tests",
    "--disable-always-build-tests",
    "--disable-gtk-doc",
    "--disable-man",
    "--disable-introspection",
    "--disable-rofiles-fuse",
    "--without-composefs",
    "--without-selinux",
    "--without-libmount",
    "--without-soup",
    "--without-soup3",
    "--with-curl",
    "--with-libarchive",
    "--with-crypto=openssl",
    "--with-gpgme",
    "--without-avahi",
    "--without-libsystemd",
]
environment = ["GPGRT_CONFIG={sysroot}/usr/bin/gpgrt-config"]
cppflags = ["-include", "{package}/patches/libostree-musl-compat.h", "-DPACKAGE_NAME=\"libostree\"", "-DPACKAGE_VERSION=\"{version}\""]

[source]
url = "https://github.com/ostreedev/ostree/releases/download/v{version}/libostree-{version}.tar.xz"
