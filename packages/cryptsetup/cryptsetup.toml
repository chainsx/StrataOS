name = "cryptsetup"
version = "2.8.0"
kind = "target"
build_system = "autotools"
dependencies = ["lvm2", "openssl", "popt", "json-c", "argon2"]
configure_args = ["--disable-ssh-token", "--disable-asciidoc", "--disable-udev", "--disable-blkid", "--disable-selinux", "--disable-nls", "--enable-libargon2", "--with-crypto_backend=openssl"]

[source]
url = "https://www.kernel.org/pub/linux/utils/cryptsetup/v2.8/cryptsetup-{version}.tar.xz"
