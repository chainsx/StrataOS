format=1
name=flatpak
version=0.3.22
summary=Flatpak runtime and its component-owned system repository
type=feature
architectures=x86_64,arm64
priority=70
requires=system-core,network
after=network
services=
storage.count=1
storage.0.id=flatpak
storage.0.image=flatpak.ext4
storage.0.mount=/var/lib/flatpak
storage.0.format=ext4
storage.0.initial_size_mib=8192
storage.0.growth=inherit
storage.0.redundancy=inherit
storage.0.lifecycle=retain
storage.0.schema=1
storage.0.bind.count=0
